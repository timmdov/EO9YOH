<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STILLFRAME</title>
<link rel="icon" href="data:," />
<style>
:root {
  --ink: #ece7de;
  --dim: #9a948a;
  --bg: #0f1113;
  --accent: #ff9a3c;
  --enemy: #c45cff;
  --panel: rgba(12, 13, 15, 0.82);
  --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, monospace;
  --display: 'Arial Black', 'Helvetica Neue', Impact, sans-serif;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  user-select: none;
}

#gfx {
  display: block;
  width: 100vw;
  height: 100vh;
  cursor: crosshair;
}

#overlay {
  position: fixed;
  top: 8px;
  right: 8px;
  font-size: 11px;
  line-height: 1.4;
  white-space: pre;
  text-align: right;
  pointer-events: none;
  text-shadow: 0 0 2px #000;
  z-index: 30;
}

#unsupported {
  position: fixed;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 16px;
  background: var(--bg);
  z-index: 100;
}

#unsupported[hidden] {
  display: none;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

#ui [hidden] {
  display: none !important;
}

.hud .crosshair {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 22px;
  height: 22px;
  transform: translate(-50%, -50%);
  transition: opacity 0.1s;
}

.hud .crosshair::before,
.hud .crosshair::after,
.hud .crosshair span {
  content: '';
  position: absolute;
  background: var(--ink);
  box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
}

.hud .crosshair::before {
  left: 10px;
  top: 0;
  width: 2px;
  height: 7px;
}

.hud .crosshair::after {
  left: 10px;
  bottom: 0;
  width: 2px;
  height: 7px;
}

.hud .crosshair span {
  left: 9px;
  top: 9px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
}

.hud-info {
  position: absolute;
  left: 24px;
  top: 20px;
  font-size: 12px;
  letter-spacing: 0.2em;
  color: var(--dim);
  white-space: pre;
}

.hud-item {
  position: absolute;
  right: 28px;
  bottom: 52px;
  font-size: 13px;
  letter-spacing: 0.3em;
}

.hud-ammo {
  position: absolute;
  right: 28px;
  bottom: 28px;
  display: flex;
  gap: 4px;
}

.hud-ammo i {
  width: 5px;
  height: 16px;
  background: var(--ink);
  box-shadow: 0 0 4px rgba(255, 255, 255, 0.4);
}

.hud-ammo i.spent {
  background: transparent;
  outline: 1px solid rgba(236, 231, 222, 0.35);
  box-shadow: none;
}

.hud-hint {
  position: absolute;
  left: 50%;
  top: calc(50% + 34px);
  transform: translateX(-50%);
  font-size: 12px;
  letter-spacing: 0.25em;
  color: var(--accent);
  text-shadow: 0 0 6px rgba(0, 0, 0, 0.9);
}

.lock-hint {
  position: absolute;
  left: 50%;
  top: 62%;
  transform: translateX(-50%);
  padding: 10px 18px;
  background: var(--panel);
  letter-spacing: 0.3em;
  font-size: 13px;
}

.card {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-size: clamp(56px, 14vw, 220px);
  font-weight: 900;
  letter-spacing: -0.02em;
  color: var(--ink);
  text-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
}

.card.alt {
  color: var(--enemy);
}

.card.pop {
  animation: pop 0.3s ease-out;
}

@keyframes pop {
  from {
    transform: scale(1.18);
    opacity: 0.2;
  }
  to {
    transform: scale(1);
    opacity: 1;
  }
}

.screen {
  position: absolute;
  inset: 0;
  pointer-events: auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  padding: 16px;
  box-sizing: border-box;
  overflow-y: auto;
  background: linear-gradient(180deg, rgba(10, 11, 13, 0.55), rgba(10, 11, 13, 0.85));
}

.screen.replay {
  background: none;
  justify-content: flex-start;
  align-items: stretch;
  cursor: pointer;
}

.logo {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(48px, 11vw, 150px);
  letter-spacing: -0.03em;
  line-height: 0.9;
}

.logo span {
  color: var(--enemy);
}

.tagline {
  margin: 0 0 18px;
  letter-spacing: 0.45em;
  color: var(--dim);
  font-size: 13px;
  text-transform: uppercase;
}

.heading {
  margin: 0;
  font-family: var(--display);
  font-size: clamp(36px, 7vw, 84px);
  letter-spacing: -0.02em;
  text-align: center;
}

.heading small {
  display: block;
  font-family: var(--mono);
  font-size: 14px;
  letter-spacing: 0.5em;
  color: var(--accent);
  margin-top: 6px;
}

.menu {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 260px;
}

button {
  font: inherit;
  color: var(--ink);
  background: transparent;
  border: 1px solid rgba(236, 231, 222, 0.25);
  padding: 12px 22px;
  letter-spacing: 0.35em;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.12s, color 0.12s, border-color 0.12s;
}

button:hover:not(:disabled),
button:focus-visible {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
  outline: none;
}

button:disabled {
  opacity: 0.3;
  cursor: default;
}

.controls {
  margin-top: 28px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px 20px;
  max-width: 720px;
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.15em;
}

.controls b {
  color: var(--ink);
  font-weight: normal;
}

.levels section {
  width: min(920px, 100%);
}

.levels h2 {
  font-size: 12px;
  letter-spacing: 0.4em;
  color: var(--dim);
  font-weight: normal;
  margin: 10px 0 8px;
}

.levels .grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 8px;
}

.levels .grid button {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  padding: 12px 14px;
  letter-spacing: 0.12em;
  text-align: left;
}

.levels .grid button em {
  font-style: normal;
  font-size: 11px;
  color: var(--dim);
}

.levels .grid button strong {
  font-size: 13px;
}

.levels .grid button small {
  font-size: 11px;
  color: var(--accent);
}

.levels .grid button.cleared {
  border-color: rgba(255, 154, 60, 0.55);
}

.levels .grid button:hover small,
.levels .grid button:hover em {
  color: inherit;
}

.settings .form {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: min(560px, 100%);
  background: var(--panel);
  padding: 18px 20px;
  box-sizing: border-box;
}

.settings label {
  display: grid;
  grid-template-columns: 1fr 180px 56px;
  align-items: center;
  gap: 12px;
  font-size: 12px;
  letter-spacing: 0.1em;
}

.settings label.check {
  grid-template-columns: 1fr auto;
}

.settings label select {
  grid-column: 2 / 4;
  font: inherit;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid rgba(236, 231, 222, 0.25);
  padding: 4px;
}

.settings input[type='range'] {
  accent-color: var(--accent);
  width: 100%;
}

.settings input[type='checkbox'] {
  accent-color: var(--accent);
  width: 18px;
  height: 18px;
}

.settings output {
  text-align: right;
  color: var(--dim);
}

.stats {
  border-collapse: collapse;
  font-size: 14px;
  letter-spacing: 0.15em;
  background: var(--panel);
}

.stats th,
.stats td {
  padding: 8px 18px;
  text-align: left;
  border-bottom: 1px solid rgba(236, 231, 222, 0.08);
}

.stats th {
  color: var(--dim);
  font-weight: normal;
}

.stats td b {
  color: var(--accent);
  font-weight: normal;
  margin-left: 8px;
}

.stats td small {
  color: var(--dim);
}

.replay-label {
  margin: 24px 28px 0;
  font-family: var(--display);
  font-size: 40px;
  color: var(--enemy);
}

.replay-label span {
  font-family: var(--mono);
  font-size: 12px;
  letter-spacing: 0.4em;
  color: var(--ink);
  margin-left: 12px;
}

.replay-skip {
  margin: 4px 28px;
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.2em;
}

.replay-progress {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  background: rgba(255, 255, 255, 0.08);
}

.replay-progress i {
  display: block;
  height: 100%;
  width: 0;
  background: var(--enemy);
}

@media (max-width: 600px) {
  .settings label {
    grid-template-columns: 1fr 120px 44px;
  }
}
</style>
</head>

var UnsupportedError = class extends Error {
};
var Gfx = class _Gfx {

  context;
  canvas;
  format;

    this.device = device;

var VERTEX_STRIDE = VERTEX_FLOATS * 4;

  attributes: [

function createBufferWithData(device, data, usage, label) {

var common_default = `
struct FrameUniforms {
  viewProj : mat4x4f,
  lightViewProj : mat4x4f,
  cameraPos : vec4f,
  camRight : vec4f,
  camUp : vec4f,
  keyDir : vec4f,
  keyColor : vec4f,
  fillDir : vec4f,
  fillColor : vec4f,
  ambientSky : vec4f,
  ambientGround : vec4f,
  fogColor : vec4f,
  screen : vec4f,
  params : vec4f,
};

struct Instance {
  model : mat4x4f,
  color : vec4f,
  extra : vec4f,
};

struct VertexIn {
  @location(0) pos : vec3f,
  @location(1) nrm : vec3f,
  @location(2) col : vec4f,
};

struct VertexOut {
  @builtin(position) clipPos : vec4f,
  @location(0) worldPos : vec3f,
  @location(1) worldNrm : vec3f,
  @location(2) albedo : vec3f,
  @location(3) emissive : f32,
  @location(4) flash : f32,
  @location(5) highlight : f32,
};

struct FragOut {
  @location(0) color : vec4f,
  @location(1) normalMask : vec4f,
};

fn hash3(p : vec3f) -> f32 {
  let q = fract(p * 0.1031);
  let r = q + dot(q, q.yzx + 33.33);
  return fract((r.x + r.y) * r.z);
}
`;

var scene_default = `
@group(0) @binding(0) var<uniform> frameData : FrameUniforms;
@group(0) @binding(1) var shadowMap : texture_depth_2d;
@group(0) @binding(2) var shadowCmp : sampler_comparison;
@group(1) @binding(0) var<storage, read> instances : array<Instance>;

@vertex
fn vsMain(vin : VertexIn, @builtin(instance_index) inst : u32) -> VertexOut {
  let data = instances[inst];
  var vout : VertexOut;
  let world = data.model * vec4f(vin.pos, 1.0);
  vout.clipPos = frameData.viewProj * world;
  vout.worldPos = world.xyz;
  vout.worldNrm = (data.model * vec4f(vin.nrm, 0.0)).xyz;
  vout.albedo = vin.col.rgb * data.color.rgb;
  vout.emissive = vin.col.a + data.color.w;
  vout.flash = data.extra.x;
  vout.highlight = data.extra.z;
  return vout;
}

fn shadowFactor(worldPos : vec3f, n : vec3f) -> f32 {
  let biased = worldPos + n * 0.04;
  let lp = frameData.lightViewProj * vec4f(biased, 1.0);
  let proj = lp.xyz / lp.w;
  let uv = proj.xy * vec2f(0.5, -0.5) + vec2f(0.5);
  let refDepth = proj.z - 0.0015;
  let texel = frameData.params.z;
  var lit = 0.0;
  for (var y = -1; y <= 1; y++) {
    for (var x = -1; x <= 1; x++) {
      lit += textureSampleCompareLevel(shadowMap, shadowCmp, uv + vec2f(f32(x), f32(y)) * texel, refDepth);
    }
  }
  lit /= 9.0;
  let inside = all(uv >= vec2f(0.0)) && all(uv <= vec2f(1.0)) && proj.z <= 1.0;
  return select(1.0, lit, inside && frameData.params.x > 0.5);
}

@fragment
fn fsMain(fin : VertexOut) -> FragOut {
  let n = normalize(fin.worldNrm);
  let keyTerm = max(dot(n, normalize(frameData.keyDir.xyz)), 0.0);
  let fillTerm = max(dot(n, normalize(frameData.fillDir.xyz)), 0.0);
  let hemi = mix(frameData.ambientGround.rgb, frameData.ambientSky.rgb, n.y * 0.5 + 0.5);
  let shade = shadowFactor(fin.worldPos, n);

  let tile = hash3(floor(fin.worldPos * 0.5 + n * 0.25));
  let albedo = fin.albedo * (0.92 + 0.12 * tile);

  var lit = albedo * (hemi + frameData.keyColor.rgb * keyTerm * shade + frameData.fillColor.rgb * fillTerm);
  lit += albedo * fin.emissive;

  let viewDir = normalize(frameData.cameraPos.xyz - fin.worldPos);
  let rim = pow(1.0 - max(dot(n, viewDir), 0.0), 2.0);
  lit += vec3f(1.0, 0.95, 0.85) * fin.highlight * (0.35 + rim * 1.5);
  lit = mix(lit, vec3f(4.0), fin.flash);

  let viewDist = length(fin.worldPos - frameData.cameraPos.xyz);
  let fogAmount = 1.0 - exp(-viewDist * frameData.fogColor.w);
  lit = mix(lit, frameData.fogColor.rgb, fogAmount);

  var fout : FragOut;
  fout.color = vec4f(lit, 1.0);
  fout.normalMask = vec4f(n, frameData.params.y);
  return fout;
}
`;

var shadow_default = `
@group(0) @binding(0) var<uniform> frameData : FrameUniforms;
@group(1) @binding(0) var<storage, read> instances : array<Instance>;

@vertex
fn vsShadow(vin : VertexIn, @builtin(instance_index) inst : u32) -> @builtin(position) vec4f {
  let world = instances[inst].model * vec4f(vin.pos, 1.0);
  return frameData.lightViewProj * world;
}
`;

var glass_default = `
@group(0) @binding(0) var<uniform> frameData : FrameUniforms;
@group(0) @binding(1) var sceneCopy : texture_2d<f32>;
@group(0) @binding(2) var linearSampler : sampler;
@group(1) @binding(0) var<storage, read> instances : array<Instance>;

@vertex
fn vsGlass(vin : VertexIn, @builtin(instance_index) inst : u32) -> VertexOut {
  let data = instances[inst];
  var vout : VertexOut;
  let world = data.model * vec4f(vin.pos, 1.0);
  vout.clipPos = frameData.viewProj * world;
  vout.worldPos = world.xyz;
  vout.worldNrm = (data.model * vec4f(vin.nrm, 0.0)).xyz;
  vout.albedo = vin.col.rgb * data.color.rgb;
  vout.emissive = vin.col.a + data.color.w;
  vout.flash = data.extra.x;
  vout.highlight = data.extra.y;
  return vout;
}

@fragment
fn fsGlass(fin : VertexOut) -> FragOut {
  let n = normalize(fin.worldNrm);
  let viewDir = normalize(frameData.cameraPos.xyz - fin.worldPos);
  let facing = max(dot(n, viewDir), 0.0);
  let fresnel = pow(1.0 - facing, 3.0);

  let tint = fin.albedo;
  let keyDir = normalize(frameData.keyDir.xyz);
  let halfVec = normalize(keyDir + viewDir);
  let spec = pow(max(dot(n, halfVec), 0.0), 64.0) * 3.0;

  let pulse = 0.75 + 0.25 * sin(frameData.cameraPos.w * 3.0 + fin.worldPos.y * 4.0);
  let core = tint * fin.emissive * pow(facing, 2.0) * pulse;

var fx_default = `
struct FxFrame {
  viewProj : mat4x4f,
  cameraPos : vec4f,
  camRight : vec4f,
  camUp : vec4f,
};

struct Segment {
  p0 : vec4f,
  p1 : vec4f,
  color : vec4f,
};

@group(0) @binding(0) var<uniform> fxFrame : FxFrame;
@group(0) @binding(1) var<storage, read> segments : array<Segment>;

struct FxOut {
  @builtin(position) clipPos : vec4f,
  @location(0) localUv : vec2f,
  @location(1) @interpolate(flat) segLen : f32,
  @location(2) color : vec3f,
  @location(3) @interpolate(flat) tailBright : f32,
  @location(4) @interpolate(flat) softness : f32,
};

@vertex
fn vsFx(@builtin(vertex_index) vi : u32, @builtin(instance_index) inst : u32) -> FxOut {
  let seg = segments[inst];
  let a = seg.p0.xyz;
  let b = seg.p1.xyz;
  let width = max(seg.p0.w, 0.0005);
  let axis = b - a;
  let axisLen = length(axis);

  var dir = fxFrame.camRight.xyz;
  var side = fxFrame.camUp.xyz;
  if (axisLen > 1e-5) {
    dir = axis / axisLen;
    let toCam = normalize(fxFrame.cameraPos.xyz - (a + b) * 0.5);
    let s = cross(dir, toCam);
    let sl = length(s);
    if (sl > 1e-4) {
      side = s / sl;
    }
  }

  var corners = array<vec2f, 6>(
    vec2f(0.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0),
    vec2f(0.0, -1.0), vec2f(1.0, 1.0), vec2f(0.0, 1.0),
  );
  let corner = corners[vi];
  let lenW = axisLen / width;
  let along = mix(-1.0, lenW + 1.0, corner.x);
  let world = a + dir * (along * width) + side * (corner.y * width);

  var fout : FxOut;
  fout.clipPos = fxFrame.viewProj * vec4f(world, 1.0);
  fout.localUv = vec2f(along, corner.y);
  fout.segLen = lenW;
  fout.color = seg.color.rgb;
  fout.tailBright = seg.p1.w;
  fout.softness = max(seg.color.w, 0.5);
  return fout;
}

@fragment
fn fsFx(fin : FxOut) -> @location(0) vec4f {
  let u = fin.localUv.x;
  let du = max(max(-u, u - fin.segLen), 0.0);
  let d = length(vec2f(du, fin.localUv.y));
  var intensity = pow(clamp(1.0 - d, 0.0, 1.0), fin.softness);
  let t = select(clamp(u / max(fin.segLen, 1e-4), 0.0, 1.0), 1.0, fin.segLen < 0.01);
  intensity *= mix(fin.tailBright, 1.0, t);
  return vec4f(fin.color * intensity, 0.0);
}
`;

struct FullOut {

@vertex

var outline_default = `
@group(0) @binding(0) var<uniform> post : PostUniforms;
@group(0) @binding(1) var hdrTex : texture_2d<f32>;
@group(0) @binding(2) var normalTex : texture_2d<f32>;
@group(0) @binding(3) var depthTex : texture_depth_2d;

fn linearDepth(d : f32) -> f32 {
  let near = post.camera.x;
  let far = post.camera.y;
  return near * far / max(far - d * (far - near), 1e-6);
}

fn loadDepth(p : vec2i) -> f32 {
  let dims = vec2i(textureDimensions(depthTex));
  return textureLoad(depthTex, clamp(p, vec2i(0), dims - 1), 0);
}

fn loadNormal(p : vec2i) -> vec4f {
  let dims = vec2i(textureDimensions(normalTex));
  return textureLoad(normalTex, clamp(p, vec2i(0), dims - 1), 0);
}

@fragment
fn fsOutline(fin : FullOut) -> @location(0) vec4f {
  let p = vec2i(fin.clipPos.xy);
  let color = textureLoad(hdrTex, p, 0);
  let dc = loadDepth(p);
  if (dc >= 1.0) {
    return color;
  }
  let lc = linearDepth(dc);
  let nc = loadNormal(p);

  var offsets = array<vec2i, 4>(vec2i(1, 0), vec2i(-1, 0), vec2i(0, 1), vec2i(0, -1));
  var depthEdge = 0.0;
  var normalEdge = 0.0;
  for (var i = 0; i < 4; i++) {
    let q = p + offsets[i];
    let ln = linearDepth(loadDepth(q));
    depthEdge = max(depthEdge, (lc - ln) / lc);
    let nn = loadNormal(q);
    normalEdge = max(normalEdge, 1.0 - dot(nc.xyz, nn.xyz));
  }

  let depthLine = smoothstep(0.04, 0.12, depthEdge);
  let normalLine = smoothstep(0.25, 0.6, normalEdge);
  var edge = max(depthLine, normalLine * 0.85);

  edge *= 1.0 - smoothstep(35.0, 70.0, lc);

  let isGlass = nc.w > 0.75;
  let lineColor = select(vec3f(0.006, 0.006, 0.008), color.rgb * 1.6 + vec3f(0.12, 0.02, 0.18), isGlass);
  return vec4f(mix(color.rgb, lineColor, edge * post.camera.w), 1.0);
}
`;

var bloom_default = `
@group(0) @binding(0) var<uniform> post : PostUniforms;
@group(0) @binding(1) var srcTex : texture_2d<f32>;
@group(0) @binding(2) var linearSampler : sampler;

fn sampleBox(uv : vec2f) -> vec3f {
  let texel = 1.0 / vec2f(textureDimensions(srcTex));
  let o = texel.xyxy * vec4f(-1.0, -1.0, 1.0, 1.0);
  var c = textureSampleLevel(srcTex, linearSampler, uv + o.xy, 0.0).rgb;
  c += textureSampleLevel(srcTex, linearSampler, uv + o.zy, 0.0).rgb;
  c += textureSampleLevel(srcTex, linearSampler, uv + o.xw, 0.0).rgb;
  c += textureSampleLevel(srcTex, linearSampler, uv + o.zw, 0.0).rgb;
  return c * 0.25;
}

@fragment
fn fsPrefilter(fin : FullOut) -> @location(0) vec4f {
  let c = sampleBox(fin.uv);
  let brightness = max(c.r, max(c.g, c.b));
  let threshold = post.fx.w;
  let knee = threshold * 0.5;
  var soft = brightness - threshold + knee;
  soft = clamp(soft, 0.0, 2.0 * knee);
  soft = soft * soft / (4.0 * knee + 1e-4);
  let contribution = max(soft, brightness - threshold) / max(brightness, 1e-4);

  return vec4f(min(c * contribution, vec3f(40.0)), 1.0);
}

@fragment
fn fsDown(fin : FullOut) -> @location(0) vec4f {
  return vec4f(sampleBox(fin.uv), 1.0);
}

@fragment
fn fsUp(fin : FullOut) -> @location(0) vec4f {
  let texel = 1.0 / vec2f(textureDimensions(srcTex));
  var c = textureSampleLevel(srcTex, linearSampler, fin.uv, 0.0).rgb * 4.0;
  c += textureSampleLevel(srcTex, linearSampler, fin.uv + vec2f(texel.x, 0.0), 0.0).rgb * 2.0;
  c += textureSampleLevel(srcTex, linearSampler, fin.uv - vec2f(texel.x, 0.0), 0.0).rgb * 2.0;
  c += textureSampleLevel(srcTex, linearSampler, fin.uv + vec2f(0.0, texel.y), 0.0).rgb * 2.0;
  c += textureSampleLevel(srcTex, linearSampler, fin.uv - vec2f(0.0, texel.y), 0.0).rgb * 2.0;
  c += textureSampleLevel(srcTex, linearSampler, fin.uv + texel, 0.0).rgb;
  c += textureSampleLevel(srcTex, linearSampler, fin.uv - texel, 0.0).rgb;
  c += textureSampleLevel(srcTex, linearSampler, fin.uv + vec2f(texel.x, -texel.y), 0.0).rgb;
  c += textureSampleLevel(srcTex, linearSampler, fin.uv + vec2f(-texel.x, texel.y), 0.0).rgb;
  return vec4f(c / 16.0, 1.0);
}
`;

var final_default = `
@group(0) @binding(0) var<uniform> post : PostUniforms;
@group(0) @binding(1) var compTex : texture_2d<f32>;
@group(0) @binding(2) var bloomTex : texture_2d<f32>;
@group(0) @binding(3) var normalTex : texture_2d<f32>;
@group(0) @binding(4) var linearSampler : sampler;

fn aces(x : vec3f) -> vec3f {
  let a = 2.51;
  let b = 0.03;
  let c = 2.43;
  let d = 0.59;
  let e = 0.14;
  return clamp((x * (a * x + b)) / (x * (c * x + d) + e), vec3f(0.0), vec3f(1.0));
}

fn grainHash(p : vec2f) -> f32 {
  let q = fract(p * vec2f(123.34, 456.21));
  let r = q + dot(q, q + 45.32);
  return fract(r.x * r.y);
}

@fragment
fn fsFinal(fin : FullOut) -> @location(0) vec4f {
  let uv = fin.uv;
  let centered = uv - vec2f(0.5);
  let radial = dot(centered, centered);

  let ca = post.grade.z * radial;
  let offs = centered * ca;
  var color = vec3f(
    textureSampleLevel(compTex, linearSampler, uv + offs, 0.0).r,
    textureSampleLevel(compTex, linearSampler, uv, 0.0).g,
    textureSampleLevel(compTex, linearSampler, uv - offs, 0.0).b,
  );

  color += textureSampleLevel(bloomTex, linearSampler, uv, 0.0).rgb * post.fx.y;
  color *= post.fx.z;

  let dims = vec2f(textureDimensions(normalTex));
  let mask = textureLoad(normalTex, vec2i(uv * dims), 0).w;
  let isEnemy = select(0.0, 1.0, mask > 0.75);

  let luma = dot(color, vec3f(0.2126, 0.7152, 0.0722));
  let desat = post.grade.y * (1.0 - isEnemy);
  color = mix(color, vec3f(luma) * vec3f(0.92, 0.97, 1.05), desat);

  color = mix(color, post.flash.rgb, post.flash.a);

  var mapped = aces(color);

  let vig = 1.0 - post.fx.x * smoothstep(0.15, 0.7, radial * 1.6);
  mapped *= vig;

  let wave = sin(post.camera.z * post.danger.y);
  let threatPulse = smoothstep(0.0, 0.3, abs(wave));
  mapped *= 1.0 - post.danger.x * threatPulse;

  let g = grainHash(fin.clipPos.xy + vec2f(post.camera.z * 61.0, post.camera.z * 17.0)) - 0.5;
  mapped += vec3f(g * post.grade.w);

  let encoded = pow(clamp(mapped, vec3f(0.0), vec3f(1.0)), vec3f(1.0 / 2.2));
  return vec4f(encoded, 1.0);
}
`;

    const look = { sensitivity: BASE_SENSITIVITY * this.save.settings.sensitivity, invertY: this.save.settings.invertY };
    const locked = input.pointerLocked;
    this.ui.showLockHint((this.state === "playing" || this.state === "intro") && !locked);
    switch (this.state) {
      case "title":
        t.timeScale = 0;
        break;
      case "intro":
        if (locked)
          this.player.look(input, dt, look);
        t.timeScale = 0;
        break;
      case "playing": {
        if (!locked) {
          t.timeScale = 0;
          break;
        }
        if (input.wasPressed("restart")) {
          this.restart(false);
          t.timeScale = 0;
          break;
        }
        this.player.update(input, dt, this.world, look, true);
        const f = this.player.toFrame(input.wasPressed("fire"), input.wasPressed("throw"), input.wasPressed("interact"));
        const acted = this.world.applyPlayerFrame(f);
        this.recorder.push(f);
        if (acted)
          this.driver.actionKick();
        const busy = this.world.player.burstLeft > 0;
        t.timeScale = this.driver.update(dt, WALK_SPEED, this.player.planarSpeed, this.player.lookSpeed, !this.player.grounded, busy);
        this.runRealTime += dt;
        break;
      }
      case "dead":
        t.timeScale = approach(t.timeScale, 0.04, 0.2, dt);
        if (this.stateTime > 0.35 && (input.wasPressed("restart") || input.wasPressed("fire")))
          this.restart(false);
        else if (this.stateTime > 1.4)
          this.restart(false);
        break;
      case "cleared":
        if (locked)
          this.player.look(input, dt, look);
        t.timeScale = approach(t.timeScale, 0.25, 0.3, dt);
        break;
      case "paused":
      case "results":
        t.timeScale = 0;
        break;
      case "replay":
        t.timeScale = 0;
        if (this.stateTime > 0.3 && input.anyPressed()) {
          this.endReplay();
          break;
        }
        if (this.replay) {
          this.replay.update(dt);
          this.ui.setReplayProgress(this.replay.progress);
          if (this.replay.done && this.stateTime > 0.5)
            this.endReplay();
        }
        break;
    }
  }
  fixedStep() {
    if (this.state === "playing" || this.state === "dead" || this.state === "cleared") {
      this.world.step(FIXED_STEP);
    }
  }
  render(t) {
    if (this.state === "playing")
      this.recorder.setLastSteps(t.stepsThisFrame);
    if (this.state === "playing" && this.world.failed)
      this.enterDead();
    else if (this.state === "playing" && this.world.cleared)
      this.enterCleared();
    const world = this.replay?.world ?? this.world;
    const inReplay = this.state === "replay" && !!this.replay;
    const ts = inReplay ? 1 : t.effectiveScale();
    const visualDt = inReplay ? t.realDt : t.simDt;
    this.handleEvents(world);
    this.fx.update(visualDt, world.static);
    this.updateAutoResolution(t.realDt);
    const eye = v3();
    let yaw;
    let pitch;
    if (inReplay && this.replay?.current) {
      const f = this.replay.current;
      eye[0] = f.pos[0];
      eye[1] = f.pos[1] + EYE_HEIGHT;
      eye[2] = f.pos[2];
      yaw = f.yaw;
      pitch = f.pitch;
    } else if (inReplay) {
      eye[0] = this.def.player.pos[0];
      eye[1] = this.def.player.pos[1] + EYE_HEIGHT;
      eye[2] = this.def.player.pos[2];
      yaw = this.def.player.yaw;
      pitch = 0;
    } else if (this.state === "title" || this.state === "results" && !this.lastResults) {
      const sc = this.scene;
      const cx = (sc.min[0] + sc.max[0]) / 2;
      const cz = (sc.min[2] + sc.max[2]) / 2;
      const r = Math.max(4, Math.min(sc.max[0] - sc.min[0], sc.max[2] - sc.min[2]) * 0.32);
      const a = t.realTime * 0.06;
      eye[0] = cx + Math.cos(a) * r;
      eye[1] = 2.4;
      eye[2] = cz + Math.sin(a) * r;
      yaw = Math.atan2(-(cx - eye[0]), -(cz - eye[2]));
      pitch = -0.12;
    } else {
      eye[0] = this.player.pos[0];
      eye[1] = this.player.pos[1] + EYE_HEIGHT;
      eye[2] = this.player.pos[2];
      yaw = this.player.yaw;
      pitch = this.player.pitch;
      if (this.state === "dead") {
        const k = Math.min(1, this.stateTime / 0.6);
        eye[1] -= k * 0.5;
        pitch = lerpN(pitch, -0.4, k * 0.5);
      }
    }
    const cam = this.camera;
    cam.position[0] = eye[0];
    cam.position[1] = eye[1];
    cam.position[2] = eye[2];
    cam.yaw = yaw;
    cam.pitch = pitch;
    cam.update();
    const vm = this.vmCamera;
    vm.position[0] = eye[0];
    vm.position[1] = eye[1];
    vm.position[2] = eye[2];
    vm.yaw = yaw;
    vm.pitch = pitch;
    vm.update();
    this.audio.setListener({ x: eye[0], y: eye[1], z: eye[2], yaw });
    this.audio.setTimeScale(this.state === "title" || this.state === "results" || this.state === "paused" ? 0.35 : ts);
    const alpha = inReplay ? 1 : t.alpha;
    this.drawWorld(world, alpha, ts, t.realTime);
    this.fx.draw(this.renderer, this.meshes);
    const showViewmodel = this.state === "playing" || this.state === "intro" || this.state === "cleared" || this.state === "paused" || inReplay;
    if (showViewmodel) {
      const pState = world.player;
      if (!inReplay)
        this.viewmodel.update(t.realDt, this.player.mouseDx, this.player.mouseDy, this.player.planarSpeed, this.player.grounded);
      const stride = inReplay ? this.replay?.current ? Math.hypot(this.replay.current.pos[0], this.replay.current.pos[2]) : 0 : this.player.stride;
      this.viewmodel.draw(this.renderer, this.meshes, eye, yaw, pitch, pState, stride, this.save.settings.reduceMotion);
    }
    this.updatePost(world, ts, t.realDt);
    this.renderer.render(cam, vm, this.post, t.realTime);
    this.updateHud(world, ts);
    const showFps = this.save.settings.showFps || this.debugOverlayForced;
    this.overlay.visible = showFps;
    if (showFps) {
      this.overlay.set("res", `${this.gfx.width}x${this.gfx.height} (${(this.gfx.getResolutionScale() * 100).toFixed(0)}%)`);
      this.overlay.set("draws", `${this.renderer.lastDrawCalls} calls, ${this.renderer.lastInstances} inst, ${this.renderer.lastSegments} fx`);
      this.overlay.set("world", `enemies ${world.enemies.length}  bullets ${world.projectiles.length}  props ${world.props.length}  shards ${this.fx.shardCount}`);
      this.overlay.set("state", this.state);
    }
    this.overlay.update(t);
  }
  drawWorld(world, alpha, ts, realTime) {
    const r = this.renderer;
    if (this.scene)
      r.drawMesh(this.scene.mesh, IDENTITY);
    const m2 = this.model;
    const tmp2 = v3();
    for (const pr of world.props) {
      lerp(tmp2, pr.prevPos, pr.pos, alpha);
      mat4.translation(tmp2, m2);
      mat4.rotateY(m2, lerpN(pr.prevRot[1], pr.rot[1], alpha), m2);
      mat4.rotateX(m2, lerpN(pr.prevRot[0], pr.rot[0], alpha), m2);
      mat4.rotateZ(m2, lerpN(pr.prevRot[2], pr.rot[2], alpha), m2);
      const highlight = world.aimProp === pr && this.state === "playing" ? 0.45 + 0.25 * Math.sin(realTime * 8) : 0;
      r.drawMesh(this.meshes.items[pr.item.kind], m2, WHITE3, 0.06, "opaque", 0, 1, highlight);
    }
    for (const e of world.enemies)
      this.drawEnemy(e, alpha);
    const trailLen = 0.6 + 5 * (1 - ts);
    const head = v3();
    const tail = v3();
    for (const b of world.projectiles) {
      lerp(head, b.prevPos, b.pos, alpha);
      const vx = b.vel[0], vy = b.vel[1], vz = b.vel[2];
      const vl = Math.hypot(vx, vy, vz) || 1;
      const traveled = Math.hypot(head[0] - b.spawnPos[0], head[1] - b.spawnPos[1], head[2] - b.spawnPos[2]);
      const l = Math.min(trailLen, traveled);
      tail[0] = head[0] - vx / vl * l;
      tail[1] = head[1] - vy / vl * l;
      tail[2] = head[2] - vz / vl * l;
      const enemyShot = b.ownerId !== 0;
      r.drawSegment(tail, head, 0.016, enemyShot ? TRAIL_ENEMY : TRAIL_PLAYER, 0, 1.2);
      r.drawSegment(head, head, 0.035, CORE, 1, 2);
    }
    const lasers = world.activeLasers();
    for (const l of lasers) {
      const hit = world.static.raycast(l.origin, l.dir, 60);
      const d = hit ? hit.t : 60;
      const end = [l.origin[0] + l.dir[0] * d, l.origin[1] + l.dir[1] * d, l.origin[2] + l.dir[2] * d];
      const k = l.progress;
      r.drawSegment(l.origin, end, 4e-3 + k * 8e-3, [0.9 * (1 + k * 6), 0.25 * (1 + k * 3), 1.6 * (1 + k * 6)], 1, 1.2);
    }
  }
  drawEnemy(e, alpha) {
    const p = this.pose;
    const pos = lerp(v3(), e.prevPos, e.pos, alpha);
    computePose({
      pos,
      yaw: lerpAngle(e.prevYaw, e.yaw, alpha),
      walkPhase: lerpN(e.prevWalkPhase, e.walkPhase, alpha),
      moveBlend: lerpN(e.prevMoveBlend, e.moveBlend, alpha),
      aimBlend: lerpN(e.prevAimBlend, e.aimBlend, alpha),
      aimPitch: e.aimPitch,
      attackT: e.meleeT > 0 ? lerpN(e.prevMeleeT, e.meleeT, alpha) : 0,
      stun: e.state === "stunned" ? 1 : 0,
      spawnT: lerpN(e.prevSpawnT, e.spawnT, alpha),
      twoHanded: enemyIsTwoHanded(e),
      kind: e.kind
    }, p);
    const tint = ENEMY_TINT[e.kind];
    const spawnT = lerpN(e.prevSpawnT, e.spawnT, alpha);
    const emissive = ENEMY_EMISSIVE[e.kind] + (1 - spawnT) * 3;
    const flash = Math.max(e.hitFlash, (1 - spawnT) * 0.5);
    for (const id of PART_IDS) {
      this.renderer.drawMesh(this.meshes.parts[id], p.parts[id], tint, emissive, "glass", flash, 0.25 + 0.75 * spawnT);
    }
    if (e.weapon)
      this.renderer.drawMesh(this.meshes.items[e.weapon.kind], p.weapon, WHITE3, 0.04, "opaque");
  }
  incomingThreat(world) {
    if (this.state !== "playing")
      return 0;
    const eye = world.playerEye(v3());
    let threat = 0;
    for (const b of world.projectiles) {
      if (!b.alive || b.ownerId === 0)
        continue;
      const d = Math.hypot(b.pos[0] - eye[0], b.pos[1] - eye[1], b.pos[2] - eye[2]);
      threat = Math.max(threat, clamp(2 - d / 8, 0, 1));
    }
    for (const e of world.enemies) {
      if (e.alive && e.telegraph > 0)
        threat = 1;
    }
    return threat;
  }
  updatePost(world, ts, realDt) {
    const s = this.save.settings;
    const p = this.post;
    const reduce = s.reduceMotion;
    let freeze = 1 - ts;
    if (this.state === "title" || this.state === "results" || this.state === "paused")
      freeze = 0.6;
    if (this.state === "replay")
      freeze = 0;
    p.freeze = freeze;
    p.desaturation = this.state === "replay" ? 0.25 : freeze * 0.7;
    p.aberration = reduce ? 0 : freeze * 0.6 + this.flash[3] * 0.8;
    p.grain = reduce ? 0 : this.state === "replay" ? 0.07 : 0.025 + freeze * 0.03;
    p.vignette = this.state === "replay" ? 0.6 : 0.3 + freeze * 0.25;
    p.bloomStrength = s.postQuality === "high" ? 0.7 : 0.5;
    p.bloomThreshold = 1;
    p.exposure = 1;
    p.outline = 1;
    this.flash[3] = approach(this.flash[3], 0, this.state === "dead" ? 0.6 : 0.25, realDt);
    if (this.state === "dead") {
      p.desaturation = Math.max(p.desaturation, 0.85);
    }
    p.flash = this.flash;
    const incoming = this.incomingThreat(world);
    this.threat = approach(this.threat, incoming, incoming > this.threat ? 0.05 : 2.5, realDt);
    p.threat = reduce ? 0 : this.threat;
  }
  updateHud(world, ts) {
    const visible = this.state === "playing" || this.state === "intro" || this.state === "cleared";
    const held = world.player.held;
    let hint = null;
    if (this.state === "playing" && world.aimProp)
      hint = `E  ${ITEM_NAMES[world.aimProp.item.kind]}`;
    else if (this.state === "playing" && held && isGun(held.kind) && held.ammo === 0)
      hint = "EMPTY — CLICK TO THROW";
    const exit = this.def.exit;
    const hud = {
      visible,
      timeScale: ts,
      itemName: held ? ITEM_NAMES[held.kind] : null,
      ammo: held && isGun(held.kind) ? held.ammo : 0,
      maxAmmo: held && isGun(held.kind) ? WEAPONS[held.kind].ammo : 0,
      hint,
      levelName: `${this.def.id}  ${this.def.name}${exit ? "  ·  REACH THE EXIT" : ""}`,
      remaining: exit ? 0 : world.remainingEnemies,
      crosshairScale: this.save.settings.crosshairScale
    };
    this.ui.updateHud(hud);
  }
  handleEvents(world) {
    const a = this.audio;
    const fx = this.fx;
    for (const ev of world.events)
      this.handleEvent(ev, a, fx);
    world.events.length = 0;
    const now = new Set();
    for (const e of world.enemies) {
      if (e.telegraph > 0) {
        now.add(e.id);
        if (!this.telegraphing.has(e.id))
          a.play("charge", { pos: e.pos });
      }
    }
    this.telegraphing = now;
  }
  handleEvent(ev, a, fx) {
    switch (ev.type) {
      case "shot":
        a.play(ev.byPlayer ? SHOT_SFX[ev.weapon] : "enemyShot", { pos: ev.byPlayer ? void 0 : ev.pos, volume: ev.byPlayer ? 0.8 : 1 });
        fx.muzzleFlash(ev.pos, ev.dir, ev.weapon === "scatter");
        break;
      case "impact":
        a.play("impact", { pos: ev.pos, volume: 0.6 });
        fx.sparks(ev.pos, ev.normal, 8);
        fx.dust(ev.pos, ev.normal, 3);
        break;
      case "enemyDeath": {
        if (ev.silent)
          break;
        const e = ev.enemy;
        computePose({
          pos: e.pos,
          yaw: e.yaw,
          walkPhase: e.walkPhase,
          moveBlend: e.moveBlend,
          aimBlend: e.aimBlend,
          aimPitch: e.aimPitch,
          attackT: e.meleeT,
          stun: e.state === "stunned" ? 1 : 0,
          spawnT: e.spawnT,
          twoHanded: enemyIsTwoHanded(e),
          kind: e.kind
        }, this.pose);
        fx.shatter(this.pose, ev.dir, ev.point, ENEMY_TINT[e.kind], this.meshes.shards.length);
        a.play("shatter", { pos: ev.point });
        break;
      }
      case "enemyHit":
        a.play("punch", { pos: ev.pos });
        fx.glints(ev.pos, 10, [0.9, 0.6, 1], 2);
        break;
      case "playerDeath":
        this.deathDir = ev.dir;
        break;
      case "bulletClash":
        a.play("clash", { pos: ev.pos });
        fx.sparks(ev.pos, [0, 1, 0], 16, [6, 6, 7]);
        break;
      case "slice":
        a.play("slice", { pos: ev.pos });
        fx.sparks(ev.pos, [0, 1, 0], 10, [7, 6, 5]);
        break;
      case "punch":
        a.play(ev.hit ? "punch" : "punchMiss", { volume: ev.hit ? 1 : 0.5 });
        break;
      case "slash":
        a.play("whoosh");
        if (ev.hit)
          a.play("slice", { volume: 0.6 });
        break;
      case "throw":
        a.play("whoosh", { volume: 0.7 });
        break;
      case "pickup":
        a.play("pickup");
        break;
      case "dryFire":
        a.play("dryFire");
        break;
      case "itemBreak":
        a.play("glassBreak", { pos: ev.pos });
        fx.smallShatter(ev.pos, [0.9, 0.95, 1], this.meshes.shards.length);
        break;
      case "propImpact":
        a.play("propImpact", { pos: ev.pos, volume: clamp(ev.speed / 8, 0.1, 0.8) });
        break;
      case "spawn":
        a.play("spawn", { pos: ev.pos });
        fx.spawnShimmer(ev.pos, [0.8, 0.4, 1]);
        break;
      case "melee":
        a.play("melee", { pos: ev.pos });
        break;
      case "telegraph":
        break;
    }
  }
  updateAutoResolution(realDt) {
    const s = this.save.settings;
    if (!s.autoResolution || this.state !== "playing")
      return;
    this.perfAccum += realDt;
    this.perfFrames++;
    if (this.perfAccum < 2)
      return;
    const avg = this.perfAccum / this.perfFrames;
    this.perfAccum = 0;
    this.perfFrames = 0;
    const prev = this.autoScale;
    if (avg > 1 / 52)
      this.autoScale = Math.max(0.5, this.autoScale - 0.1);
    else if (avg < 1 / 75)
      this.autoScale = Math.min(1, this.autoScale + 0.05);
    if (prev !== this.autoScale) {
      console.info(`[game] auto resolution: avg frame ${(avg * 1e3).toFixed(1)} ms → scale ${(s.resolutionScale * this.autoScale).toFixed(2)}`);
      this.gfx.setResolutionScale(s.resolutionScale * this.autoScale);
    }
  }
  get lastDeathDir() {
    return dirFromYawPitch(v3(), Math.atan2(-this.deathDir[0], -this.deathDir[2]), 0);
  }
};
var IDENTITY = mat4.identity();
var WHITE3 = [1, 1, 1];
var CORE = [9, 8.5, 7.5];
var TRAIL_PLAYER = [3.2, 2.2, 1.2];
var TRAIL_ENEMY = [4, 1.4, 0.6];

async function boot() {
  const canvas = document.getElementById("gfx");
  const overlayEl = document.getElementById("overlay");
  if (!canvas || !overlayEl)
    throw new Error("Missing #gfx canvas or #overlay element.");
  let game = null;
  let gfx;
  try {
    gfx = await Gfx.create(canvas, (info) => {
      game?.stop();
      if (info.reason !== "destroyed")
        showUnsupported(`The GPU device was lost: ${info.message || info.reason}. Reload the page to continue.`);
    });
  } catch (err) {
    console.error("[boot] WebGPU init failed:", err);
    showUnsupported(err instanceof UnsupportedError ? err.message : `WebGPU initialisation failed: ${String(err)}`);
    return;
  }
  game = new Game(gfx, canvas, overlayEl);
  game.start();
}
boot().catch((err) => {
  console.error("[boot] fatal:", err);
  showUnsupported(`Startup failed: ${String(err)}`);
});
</script>
